<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Seite mit Ronaldo Hintergrund</title>
  <style>
    /* Hintergrundbild: entweder lokale Datei 'images/cr7.jpg' oder externe URL einsetzen */
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      /* Beispiel: lokale Datei */
      /* background-image: url('images/cr7.jpg'); */
      /* Oder externe Bild-URL (ersetze durch eine echte URL): */
      /* background-image: url('https://example.com/path/to/cr7.jpg'); */
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      color: white;
    }

    /* halbtransparenter Overlay, damit Text lesbar bleibt */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35); /* bei Bedarf Alpha anpassen */
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
      padding: 3rem;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      margin: 0;
      text-transform: none; /* Groß-/Kleinschreibung wie gewünscht */
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <main class="content">
    <!-- Hier wurde der Text geändert -->
    <h1>Ronaldo ist der GOAT</h1>

    <!-- Beispiel weiterer Inhalt -->
    <p>Willkommen auf meiner Seite.</p>
  </main>
</body>
</html>
